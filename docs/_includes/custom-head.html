<!--
  minima's own `head.html` includes this file (named exactly
  "custom-head.html" — that's the theme's sanctioned extension point) at the
  end of <head>, so we don't have to fork the whole default layout just to
  add JSON-LD. Keeping it here means theme/gem updates never conflict with
  this file.

  No <meta name="description"> here: jekyll-seo-tag (bundled by the
  github-pages gem and invoked via {% seo %} earlier in head.html) already
  emits it from page.description/site.description, and jekyll-relative-links
  is a Pages-whitelisted plugin too — duplicating the tag here would just
  produce two conflicting <meta name="description"> elements.
-->

{% if page.url == "/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "@id": "https://github.com/ppgranger/token-saver",
  "name": "Token-Saver",
  "description": "{{ site.description | strip_html | strip_newlines | escape }}",
  "applicationCategory": "DeveloperApplication",
  "operatingSystem": "Windows, macOS, Linux",
  "softwareVersion": "2.7.1",
  "license": "https://github.com/ppgranger/token-saver/blob/main/LICENSE",
  "codeRepository": "https://github.com/ppgranger/token-saver",
  "url": "{{ site.url }}{{ site.baseurl }}/",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  },
  "author": {
    "@type": "Person",
    "name": "ppgranger",
    "url": "https://github.com/ppgranger"
  }
}
</script>
{% elsif page.url contains "/processors/" or page.url == "/benchmarks/" or page.url == "/comparison/" %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": "{{ page.title | strip_html | strip_newlines | escape }}",
  "description": "{{ page.description | strip_html | strip_newlines | escape }}",
  "url": "{{ site.url }}{{ page.url | relative_url }}",
  "isPartOf": {
    "@id": "https://github.com/ppgranger/token-saver"
  },
  "author": {
    "@type": "Person",
    "name": "ppgranger",
    "url": "https://github.com/ppgranger"
  }
}
</script>
{% endif %}
